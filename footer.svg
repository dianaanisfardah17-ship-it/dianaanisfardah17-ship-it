<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 170" width="1000" height="170" role="img" aria-label="Thanks for visiting my profile">
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#c2417f"/>
      <stop offset="0.5" stop-color="#3b1480"/>
      <stop offset="1" stop-color="#12062a"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.08"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="round"><rect width="1000" height="170" rx="18"/></clipPath>
  </defs>

  <style>
    text { font-family: 'JetBrains Mono','Fira Code','Courier New',monospace; }
    .bin { fill: #ff9cc9; font-size: 13px; opacity: 0.35; animation: fall linear infinite; }
    .code { fill: #e9d5ff; font-size: 14px; opacity: 0.22; }
    .trace { fill: none; stroke: #d9a8ff; stroke-width: 1.5; opacity: 0.45; stroke-dasharray: 6 8; animation: flow 3s linear infinite; }
    .node { fill: #ff7eb6; filter: url(#glow); animation: pulse 2.4s ease-in-out infinite; }
    .l1 { animation: fadeIn .8s .2s both; }
    .l2 { animation: fadeIn .8s .8s both; }
    .l3 { animation: fadeIn .8s 1.4s both; }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes fall { from { transform: translateY(-120px); } to { transform: translateY(240px); } }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <g clip-path="url(#round)">
    <rect width="1000" height="170" fill="url(#bg)"/>
    <rect width="1000" height="170" fill="url(#grid)"/>

    <!-- binary rain -->
    <text class="bin" x="40"  y="0" style="animation-duration:9s;animation-delay:-3s"><tspan x="40" dy="16">1</tspan><tspan x="40" dy="16">0</tspan><tspan x="40" dy="16">1</tspan><tspan x="40" dy="16">1</tspan><tspan x="40" dy="16">0</tspan></text>
    <text class="bin" x="110" y="0" style="animation-duration:11s;animation-delay:-6s"><tspan x="110" dy="16">0</tspan><tspan x="110" dy="16">1</tspan><tspan x="110" dy="16">0</tspan><tspan x="110" dy="16">0</tspan></text>
    <text class="bin" x="880" y="0" style="animation-duration:10s;animation-delay:-2s"><tspan x="880" dy="16">1</tspan><tspan x="880" dy="16">1</tspan><tspan x="880" dy="16">0</tspan><tspan x="880" dy="16">1</tspan><tspan x="880" dy="16">0</tspan></text>
    <text class="bin" x="950" y="0" style="animation-duration:8s;animation-delay:-5s"><tspan x="950" dy="16">0</tspan><tspan x="950" dy="16">1</tspan><tspan x="950" dy="16">1</tspan><tspan x="950" dy="16">0</tspan></text>

    <!-- circuit traces -->
    <path class="trace" d="M0 135 H60 L90 105 H175"/>
    <path class="trace" d="M1000 135 H940 L910 105 H825"/>
    <circle class="node" cx="175" cy="105" r="4"/>
    <circle class="node" cx="825" cy="105" r="4" style="animation-delay:1.2s"/>

    <!-- floating code symbols -->
    <text class="code" x="40" y="162">&lt;/&gt;</text>
    <text class="code" x="720" y="15">git push</text>
    <text class="code" x="215" y="165">def AI():</text>
    <text class="code" x="690" y="165">npm run dev</text>

    <!-- terminal window -->
    <g filter="url(#glow)">
      <rect x="215" y="22" width="570" height="126" rx="12" fill="#0b0418" fill-opacity="0.78" stroke="#ff7eb6" stroke-opacity="0.7" stroke-width="1.5"/>
    </g>
    <rect x="215" y="22" width="570" height="28" rx="12" fill="#ffffff" fill-opacity="0.08"/>
    <circle cx="238" cy="36" r="5" fill="#ff5f87"/>
    <circle cx="257" cy="36" r="5" fill="#ffd166"/>
    <circle cx="276" cy="36" r="5" fill="#7ee0a3"/>
    <text x="500" y="40" text-anchor="middle" font-size="11" fill="#e9d5ff" opacity="0.8">diana@informatics:~</text>

    <text class="l1" x="240" y="82"  font-size="15" fill="#ff9cc9">$ echo "Thanks for visiting my profile!"</text>
    <text class="l2" x="240" y="108" font-size="15" fill="#ffffff">Thanks for visiting my profile!</text>
    <text class="l3" x="240" y="133" font-size="15" fill="#ffb3d9">$ feel_free --to collaborate<tspan class="cursor" fill="#ffffff"> ▌</tspan></text>
  </g>
</svg>
