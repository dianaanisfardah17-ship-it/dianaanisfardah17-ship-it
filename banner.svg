<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Diana Anis Fardah - Informatics Engineering Student">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12062a"/>
      <stop offset="0.5" stop-color="#3b1480"/>
      <stop offset="1" stop-color="#c2417f"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffc2e0"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.08"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="round"><rect width="1000" height="320" rx="18"/></clipPath>
  </defs>

  <style>
    text { font-family: 'JetBrains Mono','Fira Code','Courier New',monospace; }
    .bin { fill: #ff9cc9; font-size: 13px; opacity: 0.35; animation: fall linear infinite; }
    .code { fill: #e9d5ff; font-size: 15px; opacity: 0.22; }
    .trace { fill: none; stroke: #d9a8ff; stroke-width: 1.5; opacity: 0.45; stroke-dasharray: 6 8; animation: flow 3s linear infinite; }
    .node { fill: #ff7eb6; filter: url(#glow); animation: pulse 2.4s ease-in-out infinite; }
    .l1 { animation: fadeIn .8s .2s both; }
    .l2 { animation: fadeIn .8s .7s both; }
    .l3 { animation: fadeIn .8s 1.1s both; }
    .l4 { animation: fadeIn .8s 1.5s both; }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes fall { from { transform: translateY(-120px); } to { transform: translateY(420px); } }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <g clip-path="url(#round)">
    <rect width="1000" height="320" fill="url(#bg)"/>
    <rect width="1000" height="320" fill="url(#grid)"/>

    <!-- binary rain -->
    <g>
      <text class="bin" x="30"  y="0" style="animation-duration:9s;animation-delay:-2s"><tspan x="30" dy="16">1</tspan><tspan x="30" dy="16">0</tspan><tspan x="30" dy="16">1</tspan><tspan x="30" dy="16">1</tspan><tspan x="30" dy="16">0</tspan><tspan x="30" dy="16">1</tspan></text>
      <text class="bin" x="90"  y="0" style="animation-duration:12s;animation-delay:-7s"><tspan x="90" dy="16">0</tspan><tspan x="90" dy="16">1</tspan><tspan x="90" dy="16">0</tspan><tspan x="90" dy="16">0</tspan><tspan x="90" dy="16">1</tspan></text>
      <text class="bin" x="150" y="0" style="animation-duration:10s;animation-delay:-4s"><tspan x="150" dy="16">1</tspan><tspan x="150" dy="16">1</tspan><tspan x="150" dy="16">0</tspan><tspan x="150" dy="16">1</tspan><tspan x="150" dy="16">0</tspan><tspan x="150" dy="16">0</tspan></text>
      <text class="bin" x="840" y="0" style="animation-duration:11s;animation-delay:-5s"><tspan x="840" dy="16">0</tspan><tspan x="840" dy="16">1</tspan><tspan x="840" dy="16">1</tspan><tspan x="840" dy="16">0</tspan><tspan x="840" dy="16">1</tspan></text>
      <text class="bin" x="900" y="0" style="animation-duration:8s;animation-delay:-1s"><tspan x="900" dy="16">1</tspan><tspan x="900" dy="16">0</tspan><tspan x="900" dy="16">0</tspan><tspan x="900" dy="16">1</tspan><tspan x="900" dy="16">1</tspan><tspan x="900" dy="16">0</tspan></text>
      <text class="bin" x="960" y="0" style="animation-duration:13s;animation-delay:-9s"><tspan x="960" dy="16">0</tspan><tspan x="960" dy="16">0</tspan><tspan x="960" dy="16">1</tspan><tspan x="960" dy="16">0</tspan><tspan x="960" dy="16">1</tspan></text>
    </g>

    <!-- circuit traces -->
    <path class="trace" d="M0 250 H70 L100 220 H190"/>
    <path class="trace" d="M0 90 H60 L90 120 H170 L190 140"/>
    <path class="trace" d="M1000 70 H930 L900 100 H820"/>
    <path class="trace" d="M1000 260 H940 L910 230 H830"/>
    <circle class="node" cx="190" cy="220" r="4"/>
    <circle class="node" cx="190" cy="140" r="4" style="animation-delay:.6s"/>
    <circle class="node" cx="820" cy="100" r="4" style="animation-delay:1.2s"/>
    <circle class="node" cx="830" cy="230" r="4" style="animation-delay:1.8s"/>

    <!-- floating code symbols -->
    <text class="code" x="40"  y="300">&lt;/&gt;</text>
    <text class="code" x="110" y="45">{ }</text>
    <text class="code" x="880" y="305">git push</text>
    <text class="code" x="680" y="28">SELECT *</text>
    <text class="code" x="235" y="305">def AI():</text>
    <text class="code" x="690" y="305">npm run dev</text>

    <!-- terminal window -->
    <g filter="url(#glow)">
      <rect x="215" y="42" width="570" height="236" rx="14" fill="#0b0418" fill-opacity="0.78" stroke="#ff7eb6" stroke-opacity="0.7" stroke-width="1.5"/>
    </g>
    <rect x="215" y="42" width="570" height="34" rx="14" fill="#ffffff" fill-opacity="0.08"/>
    <circle cx="240" cy="59" r="6" fill="#ff5f87"/>
    <circle cx="262" cy="59" r="6" fill="#ffd166"/>
    <circle cx="284" cy="59" r="6" fill="#7ee0a3"/>
    <text x="500" y="64" text-anchor="middle" font-size="12" fill="#e9d5ff" opacity="0.8">diana@informatics:~</text>

    <text class="l1" x="245" y="112" font-size="16" fill="#ff9cc9">$ whoami</text>
    <text class="l2" x="245" y="168" font-size="40" font-weight="700" fill="url(#name)" letter-spacing="2">Diana Anis Fardah</text>
    <text class="l3" x="245" y="206" font-size="16" fill="#e9d5ff">Informatics Engineering Student</text>
    <text class="l4" x="245" y="240" font-size="14" fill="#ffb3d9">Web  /  Data  /  AI  /  Software Engineering<tspan class="cursor" fill="#ffffff"> ▌</tspan></text>
  </g>
</svg>
